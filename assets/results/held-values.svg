<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590"><rect width="1200" height="590" rx="20" fill="#f4f3ef"/><g font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif"><text x="48" y="55" font-size="17" fill="#53665a" font-weight="400">Commerce Metrics · 공개 예제 실행 결과</text><text x="48" y="102" font-size="30" fill="#172b26" font-weight="700">미확인 값은 0으로 만들지 않는다</text><text x="48" y="142" font-size="18" fill="#53665a" font-weight="400">같은 실행 결과에서 수집 완료 날짜와 미수집 날짜의 입력 후보를 비교했다.</text><rect x="930" y="38" width="222" height="34" rx="7" fill="#244b3b"/><text x="948" y="61" font-size="14" fill="white" font-weight="400">가상 데이터 · 외부 쓰기 없음</text><rect x="48" y="184" width="1104" height="238" rx="12" fill="white" stroke="#d7ded7"/><text x="72" y="227" font-size="18" fill="#53665a" font-weight="400">날짜</text><text x="360" y="227" font-size="18" fill="#53665a" font-weight="400">지표</text><text x="650" y="227" font-size="18" fill="#53665a" font-weight="400">값</text><text x="928" y="227" font-size="18" fill="#53665a" font-weight="400">처리</text><text x="72" y="274" font-size="19" fill="#172b26" font-weight="400">2026-09-03</text><text x="360" y="274" font-size="19" fill="#53665a" font-weight="400">gross</text><text x="650" y="274" font-size="19" fill="#172b26" font-weight="400">0</text><text x="928" y="274" font-size="19" fill="#2d6247" font-weight="400">입력 후보</text><text x="72" y="311" font-size="19" fill="#172b26" font-weight="400">2026-09-03</text><text x="360" y="311" font-size="19" fill="#53665a" font-weight="400">refunds</text><text x="650" y="311" font-size="19" fill="#172b26" font-weight="400">0</text><text x="928" y="311" font-size="19" fill="#2d6247" font-weight="400">입력 후보</text><text x="72" y="348" font-size="19" fill="#172b26" font-weight="400">2026-09-08</text><text x="360" y="348" font-size="19" fill="#53665a" font-weight="400">gross</text><text x="650" y="348" font-size="19" fill="#172b26" font-weight="400">—</text><text x="928" y="348" font-size="19" fill="#91621b" font-weight="400">보류</text><text x="72" y="385" font-size="19" fill="#172b26" font-weight="400">2026-09-08</text><text x="360" y="385" font-size="19" fill="#53665a" font-weight="400">refunds</text><text x="650" y="385" font-size="19" fill="#172b26" font-weight="400">—</text><text x="928" y="385" font-size="19" fill="#91621b" font-weight="400">보류</text><text x="48" y="473" font-size="23" fill="#244b3b" font-weight="700">확인된 0은 유지하고, 미수집 값은 빈 값으로 보류한다.</text><text x="48" y="523" font-size="19" fill="#53665a" font-weight="400">전체 입력 후보 14개 · 보류 2개 · 실제 시트 입력 0회</text><text x="48" y="562" font-size="16" fill="#53665a" font-weight="400">예제의 후보 생성은 표시용이며 운영 시트의 대상·범위 검증과 쓰기 경로는 포함하지 않는다.</text></g></svg>